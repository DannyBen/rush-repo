# Manual
# https://man.openbsd.org/tmux.1

# Set the prefix key to Ctrl-a (default: Ctrl-b)
unbind C-b
set -g prefix C-a

# Prefix, then Ctrl-a: send Ctrl-a to the current application
bind C-a send-prefix

# Alt-w / Alt-s: switch to the previous / next window (no prefix)
bind -n M-w previous-window
bind -n M-s next-window

# Alt-d / Alt-a: select the next / previous pane (no prefix)
bind -n M-d select-pane -t :.+
bind -n M-a select-pane -t :.-

# Alt-arrow: navigate between panes (no prefix)
bind -n M-Right select-pane -R
bind -n M-Down select-pane -D
bind -n M-Left select-pane -L
bind -n M-Up select-pane -U

# F12: move the current pane to a new window (no prefix)
bind -n F12 break-pane

# F11: join the current pane to the next window (no prefix)
bind -n F11 join-pane -t :+1

# Prefix, then Ctrl-c: create a window in the current pane's directory
bind C-c new-window -c "#{pane_current_path}"

# Change status bar colors
set -g status-style bg=default
set -g status-fg yellow
set -g message-style fg=yellow,bg=white

# Disable right-click context menus
unbind -n MouseDown3Pane
unbind -n MouseDown3Status
unbind -n MouseDown3Border

# Prefix, then r: reload the configuration
unbind r
bind r source-file ~/.tmux.conf \; display "Configuration reloaded!"

# Prefix, then - / =: split the pane vertically / horizontally
bind - split-window -v -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Ctrl-x: toggle pane synchronization (no prefix)
bind -n C-x setw synchronize-panes

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

